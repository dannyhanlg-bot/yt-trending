name: 유튜브 급상승 갱신

on:
  schedule:
    # 2시간마다 (UTC 기준). GitHub 사정으로 몇 분~수십 분 늦어질 수 있습니다.
    - cron: "5 */2 * * *"
  workflow_dispatch:        # 저장소 Actions 탭에서 수동 실행

permissions:
  contents: write           # 결과 HTML과 스냅샷을 다시 커밋하기 위해 필요

concurrency:
  group: trending-update
  cancel-in-progress: false # 수집 도중 취소되면 스냅샷이 깨질 수 있으므로 대기시킨다

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 렌더링 검사
        # 화면 그리는 코드가 깨졌으면 여기서 멈춘다.
        # (빈 페이지가 배포되는 것을 막기 위해 수집보다 먼저 실행)
        run: python test_render.py

      - name: 수집 및 페이지 생성
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          python youtube_trending.py \
            --exclude 게임 \
            --out docs/index.html

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html snapshots
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            # 다른 실행이 먼저 푸시했을 수 있으므로 리베이스 후 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "재시도 $i"
              sleep 5
            done
          fi
